<!DOCTYPE html>
<html>
<head>
    <title>Auth Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6">
    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-4">Auth Test</h1>
        
        <div class="bg-white p-4 rounded-lg shadow-md mb-4">
            <h2 class="text-lg font-bold mb-2">Supabase Connection Test</h2>
            <div id="connection-status" class="text-sm">Testing...</div>
        </div>
        
        <div class="bg-white p-4 rounded-lg shadow-md mb-4">
            <h2 class="text-lg font-bold mb-2">Sign In Test</h2>
            <form id="test-form">
                <div class="mb-2">
                    <input type="email" id="test-email" placeholder="Email" class="w-full p-2 border rounded" value="bderico@gmail.com">
                </div>
                <div class="mb-2">
                    <input type="password" id="test-password" placeholder="Password" class="w-full p-2 border rounded">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded">Test Sign In</button>
            </form>
            <div id="test-result" class="mt-2 text-sm"></div>
        </div>
        
        <div class="bg-white p-4 rounded-lg shadow-md">
            <h2 class="text-lg font-bold mb-2">Database Test</h2>
            <button id="test-db" class="w-full bg-green-600 text-white p-2 rounded mb-2">Test Name Fetch</button>
            <div id="db-result" class="text-sm"></div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://qwntpqrpvxzcstmpdlvk.supabase.co'
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3bnRwcXJwdnh6Y3N0bXBkbHZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA4MDEyNDEsImV4cCI6MjA3NjM3NzI0MX0.4PRf07KU6vGpZWBVylhsyafPa9WsAvynjuFeVwAj_jw'
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey)
        
        // Test connection
        document.getElementById('connection-status').textContent = 'Supabase client created successfully'
        
        // Test sign in
        document.getElementById('test-form').addEventListener('submit', async (e) => {
            e.preventDefault()
            const email = document.getElementById('test-email').value
            const password = document.getElementById('test-password').value
            
            document.getElementById('test-result').textContent = 'Signing in...'
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password })
                
                if (error) {
                    document.getElementById('test-result').textContent = `Error: ${error.message}`
                } else {
                    document.getElementById('test-result').textContent = `Success! User: ${data.user?.email}`
                }
            } catch (err) {
                document.getElementById('test-result').textContent = `Exception: ${err.message}`
            }
        })
        
        // Test database
        document.getElementById('test-db').addEventListener('click', async () => {
            document.getElementById('db-result').textContent = 'Fetching names...'
            
            try {
                const { data, error } = await supabase
                    .from('male_names')
                    .select('name, name_set')
                    .limit(5)
                
                if (error) {
                    document.getElementById('db-result').textContent = `DB Error: ${error.message}`
                } else {
                    document.getElementById('db-result').textContent = `Found ${data.length} names: ${data.map(n => n.name).join(', ')}`
                }
            } catch (err) {
                document.getElementById('db-result').textContent = `Exception: ${err.message}`
            }
        })
    </script>
</body>
</html>
