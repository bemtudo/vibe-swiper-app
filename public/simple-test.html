<!DOCTYPE html>
<html>
<head>
    <title>Vibe Swiper - Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-md mx-auto p-6">
        <h1 class="text-3xl font-bold text-center mb-6">Vibe Swiper</h1>
        
        <div id="auth-section" class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-4 text-center" id="auth-title">Sign In / Sign Up</h2>
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700" id="auth-button">
                    Sign Up
                </button>
            </form>
            <div class="mt-4 text-center">
                <button id="toggle-auth" class="text-blue-600 hover:text-blue-500 text-sm">
                    Already have an account? Sign in
                </button>
            </div>
            <div id="message" class="mt-4 text-center"></div>
        </div>
        
        <div id="app-section" class="hidden">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold mb-4 text-center">Welcome to Vibe Swiper!</h2>
                
                <!-- Mixed names from all pools -->
                <div class="text-center mb-6">
                    <p class="text-gray-600 text-sm">Swipe through names from all cultures</p>
                </div>
                
                <div id="swiper-content">
                    <div class="text-center p-8 bg-gradient-to-br from-indigo-50 to-blue-100 rounded-2xl">
                        <h3 class="text-4xl font-bold text-gray-900 mb-2" id="name-display">Loading...</h3>
                        <p class="text-lg text-gray-600" id="pronunciation"></p>
                        <p class="text-sm text-gray-500 mt-2" id="origin"></p>
                        <p class="text-sm text-gray-500" id="meaning"></p>
                        
                        <div class="flex space-x-4 mt-6">
                            <button id="skip-btn" class="flex-1 py-3 px-4 border-2 border-red-600 text-red-600 rounded-full font-bold hover:bg-red-50">
                                Skip
                            </button>
                            <button id="like-btn" class="flex-1 py-3 px-4 bg-green-500 text-white rounded-full font-bold hover:bg-green-600">
                                VIBE
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://qwntpqrpvxzcstmpdlvk.supabase.co'
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF3bnRwcXJwdnh6Y3N0bXBkbHZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA4MDEyNDEsImV4cCI6MjA3NjM3NzI0MX0.4PRf07KU6vGpZWBVylhsyafPa9WsAvynjuFeVwAj_jw'
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey)
        let currentUser = null
        let names = []
        let currentIndex = 0
        let isSignUp = true

        // Check if user is already logged in
        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession()
            if (session?.user) {
                currentUser = session.user
                showApp()
                loadNames()
            }
        }

        // Handle auth form
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault()
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value
            
            try {
                let result
                if (isSignUp) {
                    // For sign up, disable email confirmation
                    result = await supabase.auth.signUp({ 
                        email, 
                        password,
                        options: {
                            emailRedirectTo: undefined // Disable email confirmation
                        }
                    })
                } else {
                    result = await supabase.auth.signInWithPassword({ email, password })
                }
                
                if (result.error) throw result.error
                
                if (isSignUp && result.user && !result.user.email_confirmed_at) {
                    document.getElementById('message').innerHTML = 'Account created! You can now sign in.'
                    // Auto-switch to sign in mode
                    setTimeout(() => {
                        isSignUp = false
                        const title = document.getElementById('auth-title')
                        const button = document.getElementById('auth-button')
                        const toggle = document.getElementById('toggle-auth')
                        
                        title.textContent = 'Sign In'
                        button.textContent = 'Sign In'
                        toggle.textContent = "Don't have an account? Sign up"
                    }, 2000)
                }
            } catch (error) {
                let errorMessage = error.message
                
                // Handle specific error cases
                if (error.message.includes('already registered') || error.message.includes('already been registered')) {
                    errorMessage = 'This email is already registered. Try signing in instead!'
                } else if (error.message.includes('Invalid login credentials')) {
                    errorMessage = 'Invalid email or password. Try again or sign up with a new email.'
                } else if (error.message.includes('Password should be at least')) {
                    errorMessage = 'Password must be at least 6 characters long.'
                }
                
                document.getElementById('message').innerHTML = 'Error: ' + errorMessage
            }
        })

        // Toggle between sign up and sign in
        document.getElementById('toggle-auth').addEventListener('click', () => {
            isSignUp = !isSignUp
            const title = document.getElementById('auth-title')
            const button = document.getElementById('auth-button')
            const toggle = document.getElementById('toggle-auth')
            
            if (isSignUp) {
                title.textContent = 'Sign Up'
                button.textContent = 'Sign Up'
                toggle.textContent = 'Already have an account? Sign in'
            } else {
                title.textContent = 'Sign In'
                button.textContent = 'Sign In'
                toggle.textContent = "Don't have an account? Sign up"
            }
            
            // Clear any previous messages
            document.getElementById('message').innerHTML = ''
        })

        // Load names from database (all pools mixed together)
        async function loadNames() {
            try {
                const { data, error } = await supabase
                    .from('male_names')
                    .select('*')
                    .order('random()')
                    .limit(50)
                if (error) throw error
                names = data || []
                currentIndex = 0
                showCurrentName()
            } catch (error) {
                console.error('Error loading names:', error)
                document.getElementById('name-display').textContent = 'Error loading names'
            }
        }

        // Show current name
        function showCurrentName() {
            if (names.length === 0) {
                document.getElementById('name-display').textContent = 'No names available'
                document.getElementById('pronunciation').textContent = ''
                document.getElementById('origin').textContent = ''
                document.getElementById('meaning').textContent = ''
                return
            }
            
            const name = names[currentIndex]
            document.getElementById('name-display').textContent = name.name
            document.getElementById('pronunciation').textContent = `/ ${name.easy_pronunciation} /`
            document.getElementById('origin').textContent = `Origin: ${name.origin}`
            document.getElementById('meaning').textContent = `Meaning: ${name.meaning}`
        }

        // Handle skip
        document.getElementById('skip-btn').addEventListener('click', () => {
            nextName()
        })

        // Handle like
        document.getElementById('like-btn').addEventListener('click', async () => {
            if (currentUser && names[currentIndex]) {
                const name = names[currentIndex]
                try {
                    const { error } = await supabase.from('user_swipes').insert({
                        user_id: currentUser.id,
                        name_id: name.id,
                        swipe_action: 'LIKE'
                    })
                    if (error) throw error
                } catch (error) {
                    console.error('Error saving swipe:', error)
                }
            }
            nextName()
        })

        // Next name
        function nextName() {
            currentIndex = (currentIndex + 1) % names.length
            showCurrentName()
        }

        // Show app section
        function showApp() {
            document.getElementById('auth-section').classList.add('hidden')
            document.getElementById('app-section').classList.remove('hidden')
        }

        // Pool selector functionality
        function updatePoolButtons() {
            POOLS.forEach(pool => {
                const button = document.getElementById(`pool-${pool.toLowerCase()}`)
                if (currentPool === pool) {
                    button.className = 'px-4 py-2 bg-blue-600 text-white rounded-full text-sm font-medium'
                } else {
                    button.className = 'px-4 py-2 bg-gray-200 text-gray-700 rounded-full text-sm font-medium hover:bg-gray-300'
                }
            })
        }

        POOLS.forEach(pool => {
            document.getElementById(`pool-${pool.toLowerCase()}`).addEventListener('click', () => {
                currentPool = pool
                updatePoolButtons()
                loadNames(currentPool)
            })
        })

        // Initialize
        checkUser()
    </script>
</body>
</html>
